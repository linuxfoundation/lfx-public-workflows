# Markdown Lint Configuration
# Documentation: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Default state for all rules
default: true

# Line length
MD013:
  line_length: 150
  code_blocks: false
  tables: false

# Allow inline HTML
MD033:
  allowed_elements:
    - details
    - summary
    - br

# First line in file should be a top level header
MD041: false

# Multiple headers with the same content
MD024:
  siblings_only: true

# Code block style
MD046:
  style: fenced

# Emphasis style
MD049:
  style: asterisk

# Strong style
MD050:
  style: asterisk

# Unordered list style
MD004:
  style: dash
