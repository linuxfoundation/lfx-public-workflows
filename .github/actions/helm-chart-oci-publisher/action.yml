name: Helm Chart OCI Publisher

description: Publish Helm Charts to OCI-based registries

author: dadrus

inputs:
  name:
    required: true
    description: The chart name
  repository:
    required: true
    description: The chart repository name
  chart_version:
    required: true
    description: The version of the chart
  app_version:
    required: false
    description: Set the appVersion in the chart to this version
  path:
    required: false
    description: Where to find the chart. Defaults to 'charts/{name}'
  registry:
    required: true
    description: The OCI registry to use
  registry_username:
    required: true
    description: The OCI registry username
  registry_password:
    required: true
    description: The OCI registry password
  helm_version:
    required: false
    description: The Helm CLI version
    default: 3.18.4

outputs:
  image:
    value: ${{ steps.result.outputs.image }}
    description: The chart image of the form '{registry}/{repository}/{image}:{tag}'
  image_name:
    value: ${{ steps.result.outputs.image_name }}
    description: The chart image name of the form '{registry}/{repository}/{image}'
  digest:
    value: ${{ steps.result.outputs.image_digest }}
    description: The digest of the image

runs:
  using: composite
  steps:
    - name: Install Helm
      shell: bash
      env:
        HELM_VERSION: ${{ inputs.helm_version }}
      run: |
        set -euo pipefail
        tmpDir="$(mktemp -d)"
        pushd "$tmpDir" >& /dev/null

        curl -sSL -o helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
        curl -sSL -o helm.tar.gz.sha256 "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz.sha256"
        echo "$(cat helm.tar.gz.sha256) helm.tar.gz" | sha256sum --check
        tar xz -f helm.tar.gz
        mkdir -p "$HOME/bin"
        mv linux-amd64/helm "$HOME/bin/helm"
        export PATH="$HOME/bin:$PATH"
        popd >& /dev/null
        rm -rf "$tmpDir"
    - name: Create Chart path
      id: chart-path
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        if [ -z "${INPUT_PATH}" ]; then
          CHART_PATH="charts/${INPUT_NAME}"
        else
          CHART_PATH="${INPUT_PATH}"
        fi
        echo "result=${CHART_PATH}" >> "${GITHUB_OUTPUT}"
    - name: Set version in Chart.yaml
      shell: bash
      env:
        CHART_PATH: ${{ steps.chart-path.outputs.result }}
        CHART_VERSION: ${{ inputs.chart_version }}
      run: |
        set -euo pipefail
        yq eval '.version = strenv(CHART_VERSION)' -i "${CHART_PATH}/Chart.yaml"
    - name: Set appVersion in Chart.yaml
      if: inputs.app_version != ''
      shell: bash
      env:
        CHART_PATH: ${{ steps.chart-path.outputs.result }}
        APP_VERSION: ${{ inputs.app_version }}
      run: |
        set -euo pipefail
        yq eval '.appVersion = strenv(APP_VERSION)' -i "${CHART_PATH}/Chart.yaml"
    - name: Login to helm registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
      run: |
        set -euo pipefail
        echo "${REGISTRY_PASSWORD}" | helm registry login -u "${REGISTRY_USERNAME}" --password-stdin "${REGISTRY}"
    - name: Package the chart
      shell: bash
      env:
        CHART_PATH: ${{ steps.chart-path.outputs.result }}
        CHART_VERSION: ${{ inputs.chart_version }}
      run: |
        set -euo pipefail
        if [ -f "${CHART_PATH}/Chart.lock" ]; then
          yq -r '.dependencies[] | select(.repository | contains("oci://") == false) | "\(.name) \(.repository)"' \
            "${CHART_PATH}/Chart.yaml" | xargs -L1 helm repo add --force-update
          helm dependency build "${CHART_PATH}"
        fi
        helm package "${CHART_PATH}" --version "${CHART_VERSION}"
    - name: Push the packaged chart to the registry
      id: result
      shell: bash
      env:
        CHART_NAME: ${{ inputs.name }}
        CHART_VERSION: ${{ inputs.chart_version }}
        REGISTRY: ${{ inputs.registry }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        OUTPUT=$(helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${REPOSITORY}" 2>&1) || {
          echo "Helm push failed: $OUTPUT"
          exit 1
        }
        IMAGE_NAME="${REGISTRY}/${REPOSITORY}/${CHART_NAME}"
        IMAGE="$(echo "$OUTPUT" | grep "Pushed:" | awk '{print $2}')"
        DIGEST="$(echo "$OUTPUT" | grep "Digest:" | awk '{print $2}')"
        if [ -z "$IMAGE" ] || [ -z "$DIGEST" ]; then
          echo "Failed to extract image or digest from output: $OUTPUT"
          exit 1
        fi
        {
          echo "image_name=$IMAGE_NAME"
          echo "image=$IMAGE"
          echo "image_digest=$DIGEST"
        } >> "${GITHUB_OUTPUT}"
    - name: Logout from the registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        helm registry logout "${REGISTRY}"
