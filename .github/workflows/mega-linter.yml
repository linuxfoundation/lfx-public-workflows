name: MegaLinter

"on":
  pull_request: null

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # MegaLinter
      - name: MegaLinter
        id: ml
        # Use the Documentation flavor: this repo is reusable workflows,
        # one composite action, and Markdown. Keep this SHA in sync with
        # the version comment (lfx-public-workflows#18 pinning policy).
        uses: oxsecurity/megalinter/flavors/documentation@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc  # v9.6.0
        env:
          # Only Actions-specific values (secrets, runner behavior) belong
          # here. Generic MegaLinter/repo config belongs in .mega-linter.yml
          # so local runs (e.g. mega-linter-runner) get the same behavior.
          #
          # All available variables are described in documentation
          # https://megalinter.io/configuration/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # zizmor's "artipacked" audit needs the GitHub API (to verify
          # SHA-pinned action tags), which requires GITHUB_TOKEN.
          ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES: GITHUB_TOKEN
